<script>
document.getElementById('username').addEventListener('input', function () {
    // Remove non-alphabetic characters and limit to 9 characters
    this.value = this.value.replace(/[^a-zA-Z]/g, '').slice(0, 9);
});
</script> 
    
    <script>
    const voiceButton = document.getElementById('voice-button');
    const messageInput = document.getElementById('message-input');

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = 'en-US';
recognition.continuous = true;  // Allow continuous speech recognition
recognition.interimResults = true;  // Provide results while speaking

voiceButton.addEventListener('click', function() {
    let button = this;
    button.classList.add('active');  // Make the button active

    // Set a 10-second timeout to remove the active class
    setTimeout(() => {
        button.classList.remove('active');
    }, 10000);

    // Start speech recognition
    recognition.start();

    // Handle results when speech is detected
    recognition.onresult = function(event) {
        let transcript = '';
        // Loop through the results to capture everything
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        messageInput.value = transcript;  // Display speech in the input field
    };

    // Ensure recognition continues and doesn't stop after a few words
    recognition.onend = function() {
        // Restart recognition after it ends if needed
        recognition.start();
    };
});

// Handle speech recognition errors
recognition.onerror = function(event) {
    console.log("Error occurred: " + event.error);
};
</script>
    
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const usernameInput = document.getElementById('username');
            const countrySelect = document.getElementById('country');
            const userDetails = document.getElementById('user-details');
            const chatContainer = document.getElementById('chat-container');
            const loginContainer = document.getElementById('login-container');

            // Check for saved user details in localStorage
            const savedUsername = localStorage.getItem('username');
            const savedCountry = localStorage.getItem('country');

            if (savedUsername && savedCountry) {
                // Auto-login if data exists
                loginContainer.style.display = 'none';
                chatContainer.style.display = 'block';
                userDetails.textContent = `${savedUsername} (${savedCountry})`;
                updateStatus();
            }

            // On clicking join, save username and country
            document.getElementById('join-button').addEventListener('click', () => {
                const username = usernameInput.value.trim();
                const country = countrySelect.value;

                if (username && country) {
                    // Save to localStorage
                    localStorage.setItem('username', username);
                    localStorage.setItem('country', country);

                    // Switch to chat view
                    loginContainer.style.display = 'none';
                    chatContainer.style.display = 'block';
                    userDetails.textContent = `${username} (${country})`;
                    updateStatus();
                } else {
                    alert('Please enter your name and select a country.');
                }
            });

            // Update online/offline status
            function updateStatus() {
                const statusElement = document.getElementById('user-status');
                if (navigator.onLine) {
                    statusElement.textContent = 'Online';
                    statusElement.style.color = 'green';
                } else {
                    statusElement.textContent = 'Offline';
                    statusElement.style.color = 'red';
                }
            }

            // Listen for online/offline events
            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);
        });
    </script>
