<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatZynk</title><link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="app.js"></script></head>
<body>
<section id="login" class="login panel">
  <div class="brand">✦ ChatZynk</div><p>Create your profile to start chatting</p>
  <input id="profile-name" maxlength="32" placeholder="Your name" autocomplete="name">
  <select id="profile-gender"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select>
  <input id="profile-age" type="number" min="13" max="120" placeholder="Age">
  <select id="profile-country"><option value="">Select country</option></select>
  <button id="save-profile" class="primary">Create profile</button><small>By continuing, you agree to use ChatZynk respectfully.</small>
</section>
<main id="app" hidden>
<header><div><div class="brand">✦ ChatZynk</div><small id="me-label"></small></div><div class="header-actions"><button id="profile-open" title="Profile">👤</button><button id="settings-open" title="Settings">⚙️</button></div></header>
<nav><button class="tab active" data-tab="groups">Groups</button><button class="tab" data-tab="people">People</button><button class="tab" data-tab="chats">Chats</button></nav>
<section id="groups" class="view">
  <div class="section-head"><h2>Groups</h2><button id="create-group-open" class="primary">＋ Create group</button></div>
  <div id="group-list" class="cards"></div>
</section>
<section id="people" class="view" hidden><div class="section-head"><h2>People</h2><span id="people-count"></span></div><div id="people-list" class="cards"></div></section>
<section id="chats" class="view" hidden><h2>Recent chats</h2><div id="chat-list" class="cards"></div></section>
<section id="conversation" hidden>
  <div class="conversation-head"><button id="back-list">←</button><div><b id="conversation-title"></b><small id="conversation-subtitle"></small></div><button id="conversation-menu">⋮</button></div>
  <div id="members-strip"></div><div id="thread"></div>
  <div class="composer"><label class="attach" title="Share image/audio">＋<input id="media-input" type="file" accept="image/*,audio/*" hidden></label><input id="message-text" placeholder="Write a message…"><button id="send-message" class="primary">➤</button></div>
</section>
</main>
<dialog id="group-dialog"><form method="dialog" id="group-form"><h2>Create group</h2><input id="group-name" maxlength="50" placeholder="Group name" required><label>Emoji icon</label><div id="emoji-choices" class="emoji-choices"></div><button class="primary" id="create-group" type="button">Create</button><button class="quiet" value="cancel">Cancel</button></form></dialog>
<dialog id="profile-dialog"><form method="dialog"><h2>Edit profile</h2><input id="edit-name" maxlength="32" placeholder="Name"><select id="edit-gender"><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select><input id="edit-age" type="number" min="13" max="120" placeholder="Age"><select id="edit-country"></select><button class="primary" id="profile-save" type="button">Save profile</button><button class="quiet" value="cancel">Close</button></form></dialog>
<dialog id="settings-dialog"><form method="dialog"><h2>Settings</h2><label class="setting">Messages from <select id="message-privacy"><option value="everyone">Everyone</option><option value="friends">Friends only</option></select></label><label class="setting">Notifications <input id="notifications-toggle" type="checkbox"></label><label class="setting">Theme <select id="theme-select"><option value="dark">Dark</option><option value="light">Light</option></select></label><p class="hint">Friends are people you add from the People list. Group chats remain available to group members.</p><button class="primary" id="settings-save" type="button">Save settings</button><button class="quiet" value="cancel">Close</button></form></dialog>
<dialog id="members-dialog"><form method="dialog"><h2>Group members</h2><div id="members-list"></div><button class="quiet" value="cancel">Close</button></form></dialog>
<div id="toast" role="status"></div>
</body></html>
